project_id = "checkpoint-launcher"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "8MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = [
  "http://localhost:5173",
  "https://checkpointlauncher.com"
]

# Cron / service-role only. Function also validates Bearer against
# SUPABASE_SERVICE_ROLE_KEY or CRON_SECRET in code.
[functions.notify-trophy-unlock]
verify_jwt = true
